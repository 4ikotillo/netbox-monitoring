{% comment %}Общие стили плагина. Подключается из layout-обёртки или из каждого шаблона.{% endcomment %}
<style>
.nbm-card{background:var(--nbx-color-background-1, #fff);border:1px solid rgba(0,0,0,.08);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px}
.nbm-card .head{display:flex;align-items:center;justify-content:space-between}
.nbm-card .name{display:flex;align-items:center;gap:8px;font-weight:500;font-size:15px;color:inherit;text-decoration:none}
.nbm-card .name:hover{text-decoration:underline}
.nbm-dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}
.nbm-stats{display:flex;gap:24px}
.nbm-stats .lbl{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.5px}
.nbm-stats .val{font-size:22px;font-weight:500;line-height:1}
.nbm-stats .sub{font-size:11px;color:#666;margin-top:4px}
.nbm-bar{display:flex;height:5px;border-radius:3px;overflow:hidden;background:#eee}
.nbm-bar > span{display:block;height:100%}
.nbm-bar .ok{background:#1D9E75}
.nbm-bar .wl{background:#EF9F27}
.nbm-bar .off{background:#E24B4A}
.nbm-bar .un{background:#bbb}
.nbm-totals{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.nbm-tot{background:#f5f5f3;border-radius:8px;padding:12px 16px}
.nbm-tot .l{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.5px}
.nbm-tot .v{font-size:24px;font-weight:500;line-height:1.2}
.nbm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-bottom:24px}
.nbm-section-h{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.5px;margin:0 0 10px;display:flex;align-items:center;justify-content:space-between}
.nbm-empty{background:#f8f7f5;border:1px dashed #ddd;border-radius:8px;padding:20px;text-align:center;color:#888}
.nbm-noconf{background:#f5f5f3;border:1px dashed #ccc;color:#888}
.nbm-noconf .name{color:#666;font-style:italic}
.nbm-pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500;white-space:nowrap}
.nbm-pill.ok{background:rgba(29,158,117,.15);color:#0F6E56}
.nbm-pill.wl{background:rgba(239,159,39,.18);color:#854F0B}
.nbm-pill.off{background:rgba(226,75,74,.18);color:#A32D2D}
.nbm-pill.un{background:rgba(0,0,0,.08);color:#666}
.nbm-hint{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:8px;margin-bottom:18px;border:1px solid transparent}
.nbm-hint-icon{font-size:20px;line-height:1;margin-top:1px}
.nbm-hint-title{font-weight:500;font-size:14px}
.nbm-hint-detail{font-size:12px;color:inherit;opacity:.85;margin-top:2px}
.nbm-hint-ok{background:rgba(29,158,117,.10);border-color:rgba(29,158,117,.25);color:#0F6E56}
.nbm-hint-warn{background:rgba(239,159,39,.12);border-color:rgba(239,159,39,.30);color:#854F0B}
.nbm-hint-danger{background:rgba(226,75,74,.12);border-color:rgba(226,75,74,.30);color:#A32D2D}
.nbm-hint-info{background:rgba(50,130,200,.10);border-color:rgba(50,130,200,.25);color:#185FA5}
.nbm-modems-row{background:rgba(0,0,0,.02)}
.nbm-modems-row td{padding-left:36px !important;font-size:13px}
.nbm-suggest{background:rgba(239,159,39,.08);border:1px solid rgba(239,159,39,.25);border-radius:8px;padding:14px;margin-bottom:16px}
.nbm-suggest h5{margin:0 0 6px;font-size:14px;color:#854F0B}
.nbm-suggest .si{font-size:12px;color:#666;margin-bottom:10px}
html.dark .nbm-card,html[data-bs-theme=dark] .nbm-card{background:#1f2937;border-color:rgba(255,255,255,.1)}
html.dark .nbm-tot,html[data-bs-theme=dark] .nbm-tot{background:#1f2937}
html.dark .nbm-empty,html.dark .nbm-noconf,html[data-bs-theme=dark] .nbm-empty,html[data-bs-theme=dark] .nbm-noconf{background:#1a202c;border-color:#374151;color:#9ca3af}
html.dark .nbm-bar,html[data-bs-theme=dark] .nbm-bar{background:#374151}
html.dark .nbm-modems-row,html[data-bs-theme=dark] .nbm-modems-row{background:rgba(255,255,255,.03)}
</style>
